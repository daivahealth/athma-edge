services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bcpuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-athma_edge}
    ports:
      # Host port 5433, container port 5432. 5432 collides with other
      # Postgres instances a developer is likely to be running; nothing
      # inside the stack uses this mapping, since bcp-api, n8n and
      # pgadmin reach postgres:5432 over the compose network.
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bcpuser}']
      interval: 10s
      timeout: 5s
      retries: 5

  bcp-api:
    build:
      # Repo root: the image builds the SPA as well as the API.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bcpuser}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-athma_edge}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRY: ${JWT_EXPIRY:-8h}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:?DEFAULT_TENANT_ID must be set}
      PDF_STORAGE_PATH: /data/pdfs
      PORT: 3100
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    ports:
      # This service fronts the stack: it serves the SPA and the API on one
      # origin. HTTP only — a hospital that wants TLS puts its own reverse
      # proxy in front (nginx/README.md has a sample config).
      - '${HTTP_PORT:-80}:3100'
    volumes:
      - ./local-bcp-storage/pdfs:/data/pdfs
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-bcpuser}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      N8N_BASIC_AUTH_ACTIVE: 'true'
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:?N8N_PASSWORD must be set}
      # Schedule/cron triggers fire in GENERIC_TIMEZONE. n8n defaults to
      # America/New_York, which silently shifts every cron by hours.
      GENERIC_TIMEZONE: ${TZ:-Asia/Kolkata}
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - '127.0.0.1:5678:5678'
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  # Serves the built SPA directly and proxies /api to bcp-api. There is no
  # separate UI container since the frontend moved from Next.js to Vite.

volumes:
  postgres_data:
  n8n_data:
