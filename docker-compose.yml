services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      postgres_user: ${postgres_user:-bcpuser}
      postgres_password: ${postgres_password:?postgres_password must be set}
      postgres_db: ${postgres_db:-athma_edge}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['cmd-shell', 'pg_isready -u ${postgres_user:-bcpuser}']
      interval: 10s
      timeout: 5s
      retries: 5

  bcp-api:
    build:
      context: ./backend
      dockerfile: dockerfile
    restart: unless-stopped
    environment:
      database_url: postgresql://${postgres_user:-bcpuser}:${postgres_password:?postgres_password must be set}@postgres:5432/${postgres_db:-athma_edge}?schema=public
      jwt_secret: ${jwt_secret:?jwt_secret must be set}
      jwt_expiry: ${jwt_expiry:-8h}
      bcrypt_rounds: ${bcrypt_rounds:-12}
      default_tenant_id: ${default_tenant_id:?default_tenant_id must be set}
      pdf_storage_path: /data/pdfs
      port: 3100
      frontend_origin: ${frontend_origin:-http://localhost}
      api_docs_enabled: ${api_docs_enabled:-false}
    volumes:
      - ./local-bcp-storage/pdfs:/data/pdfs
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      db_type: postgresdb
      db_postgresdb_host: postgres
      db_postgresdb_port: 5432
      db_postgresdb_database: n8n
      db_postgresdb_user: ${postgres_user:-bcpuser}
      db_postgresdb_password: ${postgres_password:?postgres_password must be set}
      n8n_basic_auth_active: 'true'
      n8n_basic_auth_user: ${n8n_user:-admin}
      n8n_basic_auth_password: ${n8n_password:?n8n_password must be set}
      # schedule/cron triggers fire in generic_timezone. n8n defaults to
      # america/new_york, which silently shifts every cron by hours.
      generic_timezone: ${tz:-asia/kolkata}
      tz: ${tz:-asia/kolkata}
    ports:
      - '127.0.0.1:5678:5678'
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data: