upstream bcp_api {
    server bcp-api:3100;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;
    proxy_hide_header X-Powered-By;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://bcp_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints these filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: every unknown path is a React Router route,
    # so it has to fall through to index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or a deploy leaves browsers
    # pointing at asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
