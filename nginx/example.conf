# Sample reverse-proxy config. NOT part of the stack — see README.md.
#
# Athma Edge serves the SPA and the API itself on one port, and handles its own
# client-side routing and cache headers. A proxy in front only needs to pass
# requests through. Adapt before use: the upstream address, server_name and
# certificate paths are placeholders.

upstream athma_edge {
    server bcp-api:3100;
}

server {
    listen 443 ssl;
    http2 on;
    server_name athma-edge.hospital.local;

    ssl_certificate     /etc/ssl/certs/athma-edge.crt;
    ssl_certificate_key /etc/ssl/private/athma-edge.key;

    # PDF downloads stream out; nothing is uploaded through the app.
    client_max_body_size 10M;

    location / {
        proxy_pass http://athma_edge;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The audit log records the client IP from this header.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name athma-edge.hospital.local;
    return 301 https://$host$request_uri;
}
